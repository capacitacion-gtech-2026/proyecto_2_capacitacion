name: CI con Blacksmith

on:
  push:
    branches:
      - main
      - prueba-github-actions
  pull_request:
    branches:
      - main
      - prueba-github-actions

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: pnpm run lint
          - name: Typecheck
            command: pnpm exec tsc --noEmit
          - name: Tests
            command: pnpm run test
          - name: Build
            command: pnpm run build

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar ${{ matrix.name }}
        run: ${{ matrix.command }}

  docker:
    name: Construir y publicar Docker
    if: github.event_name == 'push'
    needs: quality
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Builder de Blacksmith
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: Dockerfile

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Preparar etiquetas Docker
        id: docker-tags
        env:
          IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/proyecto-2-capacitacion
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${GITHUB_REF_NAME}"
            echo "${IMAGE_NAME}:${GITHUB_SHA}"
            if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Construir y publicar imagen Docker
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}
