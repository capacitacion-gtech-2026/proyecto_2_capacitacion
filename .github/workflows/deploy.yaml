name: CI con Blacksmith

on:
  push:
    branches:
      - main
      - prueba-github-actions
  pull_request:
    branches:
      - main
      - prueba-github-actions

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: pnpm run lint
          - name: Typecheck
            command: pnpm exec tsc --noEmit
          - name: Tests
            command: pnpm run test
          - name: Build
            command: pnpm run build

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar ${{ matrix.name }}
        run: ${{ matrix.command }}

  docker:
    name: Construir y desplegar Docker en EC2

    if: github.event_name == 'push' && github.ref_name == 'prueba-github-actions'

    needs: quality

    runs-on: blacksmith-2vcpu-ubuntu-2404

    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Builder de Blacksmith
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: Dockerfile

      - name: Construir imagen Docker
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          load: true
          tags: proyecto-2-capacitacion:ec2
          build-args: |
            NEXT_PUBLIC_CONVEX_URL=${{ vars.NEXT_PUBLIC_CONVEX_URL }}

      - name: Preparar conexion SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh

          echo "$EC2_SSH_KEY" > ~/.ssh/ec2.pem

          chmod 600 ~/.ssh/ec2.pem

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Exportar imagen Docker
        run: |
          docker save proyecto-2-capacitacion:ec2 \
            -o proyecto-2-capacitacion.tar

      - name: Copiar imagen Docker a EC2
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          scp \
            -i ~/.ssh/ec2.pem \
            proyecto-2-capacitacion.tar \
            "$EC2_USER@$EC2_HOST:/tmp/proyecto-2-capacitacion.tar"

      - name: Desplegar contenedor en EC2
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2.pem \
            "$EC2_USER@$EC2_HOST" << 'EOF'

            sudo docker load \
              -i /tmp/proyecto-2-capacitacion.tar

            sudo docker rm \
              -f proyecto-2 \
              2>/dev/null || true

            sudo docker run \
              -d \
              --name proyecto-2 \
              --restart unless-stopped \
              -p 3000:3000 \
              proyecto-2-capacitacion:ec2

            rm -f /tmp/proyecto-2-capacitacion.tar

            sudo docker image prune -f

            sudo docker ps

          EOF